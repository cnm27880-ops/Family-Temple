<body>

<!-- ========== Navigation（由 js/layout.js 注入）========== -->
<div id="site-nav"></div>

<!-- ========== Jiaobei App ========== -->
<main class="jiaobei-app">

  <!-- Stage 1: Choose Communication Method -->
  <section class="jiaobei-stage" data-stage="1">
    <div class="stage-content stage-center">
      <h1 class="stage-title">稟告神明</h1>
      <p class="stage-subtitle">在擲筊之前，請先向神明表明來意</p>
      <div class="method-cards">
        <button class="method-card" data-method="silent">
          <span class="method-icon"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><!-- 香爐三炷香 --><path d="M11.5 5.5v8.5M16 4v10M20.5 5.5v8.5"/><path d="M6 15h20"/><path d="M8.2 15h15.6l-1.7 10H9.9z"/></svg></span>
          <h3 class="method-name">默念祈願</h3>
          <p class="method-desc">於心中默念姓名、生辰與所求之事</p>
        </button>
        <button class="method-card" data-method="write">
          <span class="method-icon"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><!-- 毛筆 --><path d="M21.8 6.4l3.8 3.8-12.2 12.2-3.8-3.8z"/><path d="M9.6 18.6L6 26l7.4-3.6z"/><path d="M22.6 9.2l.6.6" opacity=".45"/></svg></span>
          <h3 class="method-name">書寫心願</h3>
          <p class="method-desc">將心中所求化為文字，稟告神明</p>
        </button>
      </div>
    </div>
  </section>

  <!-- Stage 2a: Silent Countdown -->
  <section class="jiaobei-stage" data-stage="2a" hidden>
    <div class="stage-content stage-center">
      <p class="countdown-hint">請於心中默念您的姓名、生辰與所求之事</p>
      <div class="countdown-circle">
        <span class="countdown-number" id="countdownNumber" role="timer" aria-live="off">10</span>
      </div>
      <!-- 默念完不必等倒數走完 -->
      <button class="btn-seal btn-seal--compact countdown-skip" id="skipCountdownBtn">
        已稟告完畢，開始擲筊
      </button>
    </div>
  </section>

  <!-- Stage 2b: Write Wish -->
  <section class="jiaobei-stage" data-stage="2b" hidden>
    <div class="stage-content stage-center">
      <div class="wish-paper" id="wishPaper">
        <label class="sr-only" for="wishTextarea">心願內容</label>
        <textarea
          class="wish-textarea"
          id="wishTextarea"
          maxlength="100"
          placeholder="願以此言，稟告神明……"
        ></textarea>
        <div class="wish-counter"><span id="wishCount">0</span> / 100</div>
      </div>
      <button class="btn-seal wish-submit-btn" id="wishSubmitBtn">稟告神明</button>
    </div>
  </section>

  <!-- Stage 3: Throw Jiaobei -->
  <section class="jiaobei-stage" data-stage="3" hidden>
    <div class="stage-content stage-center">

      <!-- 問事類型：重大事項依傳統需連得三次聖筊 -->
      <div class="throw-mode" id="throwMode" role="group" aria-label="問事類型">
        <button class="mode-btn active" data-mode="single" aria-pressed="true">
          <span class="mode-name">一般詢問</span>
          <span class="mode-note">擲一次即可</span>
        </button>
        <button class="mode-btn" data-mode="triple" aria-pressed="false">
          <span class="mode-name">重大事項</span>
          <span class="mode-note">需連三聖筊</span>
        </button>
      </div>

      <div class="altar-scene">
        <!-- Left candle glow -->
        <div class="candle-glow candle-glow--left"></div>
        <!-- Right candle glow -->
        <div class="candle-glow candle-glow--right"></div>

        <img id="baguaImg" src="images/bagua.svg" alt="太極八卦圖" class="bagua-icon" hidden>

        <!-- 連三聖筊進度 -->
        <div class="streak-track" id="streakTrack" hidden aria-live="polite">
          <span class="streak-label">連三聖筊</span>
          <span class="streak-dots">
            <span class="streak-dot"></span>
            <span class="streak-dot"></span>
            <span class="streak-dot"></span>
          </span>
        </div>

        <button class="btn-seal throw-btn" id="throwBtn">擲筊問神</button>
      </div>
    </div>
  </section>

  <!-- Stage 4: Result -->
  <section class="jiaobei-stage" data-stage="4" hidden>
    <div class="stage-content stage-center">
      <div class="result-area" id="resultArea">
        <div class="result-glow" id="resultGlow"></div>
        <img class="result-image" id="resultImage" src="" alt="" hidden>
        <h2 class="result-title" id="resultTitle"></h2>
        <p class="result-desc" id="resultDesc"></p>
        <p class="result-progress" id="resultProgress" hidden></p>
      </div>
      <div class="result-actions">
        <button class="btn-seal result-btn" id="retryBtn">再擲一次</button>
        <button class="btn-seal result-btn" id="saveBtn">儲存至祈福牆</button>
        <button class="btn-seal result-btn" id="shareBtn">分享結果</button>
      </div>
    </div>
  </section>

</main>

<!-- ========== Footer（由 js/layout.js 注入）========== -->
<div id="site-footer"></div>

<!-- Confirm Modal -->
<div class="confirm-modal" id="confirmModal" hidden>
  <div class="confirm-modal-backdrop"></div>
  <div class="confirm-modal-box">
    <h2 class="confirm-modal-title" id="confirmTitle">儲存至祈福牆</h2>
    <p class="confirm-modal-text">您的心願將公開顯示於祈福牆，確認儲存？</p>
    <div class="confirm-modal-field">
      <label class="confirm-modal-label" for="saveNickInput">署名</label>
      <input type="text" class="confirm-modal-input" id="saveNickInput"
             maxlength="10" placeholder="虔誠信眾（可留空）">
    </div>
    <p class="confirm-modal-error" id="confirmError" hidden></p>
    <div class="confirm-modal-actions">
      <button class="btn-seal btn-seal--compact" id="confirmYes">確認</button>
      <button class="btn-seal btn-seal--compact" id="confirmNo">取消</button>
    </div>
  </div>
</div>

<!-- Save Toast -->
<div class="save-toast" id="saveToast" role="status" aria-live="polite" hidden>已儲存 ✓</div>

<script src="js/layout.js" defer></script>
<script src="js/temple-common.js" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/supabase-api.js" defer></script>
<script src="js/jiaobei.js" defer></script>
</body>
</html>
