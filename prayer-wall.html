<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Security: Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
                 font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
                 img-src 'self' data:;
                 connect-src 'self' https://kljxjzfbbiinbpzjuaqz.supabase.co;
                 frame-src 'none';
                 object-src 'none';
                 base-uri 'self';
                 form-action 'self'">

  <!-- Security: Prevent MIME-type sniffing -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <!-- Security: Referrer Policy -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Security: Permissions Policy -->
  <meta http-equiv="Permissions-Policy"
        content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">

  <title>祈福牆 — 天虛宮</title>

  <!-- SEO -->
  <meta name="description" content="天虛宮祈福牆 — 寫下您的心願，與眾人的祝福一同飄向天際。">
  <meta name="theme-color" content="#B8412E">

  <!-- Open Graph（分享到 LINE / Facebook 的預覽） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="天虛宮">
  <meta property="og:title" content="祈福牆 — 天虛宮">
  <meta property="og:description" content="寫下您的心願，與眾人的祝福一同飄向天際。">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:url" content="https://cnm27880-ops.github.io/Family-Temple/prayer-wall.html">
  <meta property="og:image" content="https://cnm27880-ops.github.io/Family-Temple/images/og-cover.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="祈福牆 — 天虛宮">
  <meta name="twitter:description" content="寫下您的心願，與眾人的祝福一同飄向天際。">
  <meta name="twitter:image" content="https://cnm27880-ops.github.io/Family-Temple/images/og-cover.jpg">

  <!-- Canonical -->
  <link rel="canonical" href="https://cnm27880-ops.github.io/Family-Temple/prayer-wall.html">

  <!-- Favicon / 加入主畫面 -->
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/prayer-wall.css">
</head>
<body>

<!-- ========== Navigation（由 js/layout.js 注入）========== -->
<div id="site-nav"></div>

<!-- ========== Hero ========== -->
<section class="pw-hero">
  <div class="lattice-pattern"></div>
  <div class="pw-hero-content">
    <h1 class="pw-hero-title">祈福牆</h1>
    <p class="pw-hero-subtitle">願每一份心意，都能上達天聽</p>
    <a href="#write-section" class="btn-seal pw-hero-btn">✦ 寫下心願</a>
  </div>
</section>

<!-- ========== Write Section ========== -->
<section class="pw-write" id="write-section">
  <div class="container">
    <div class="section-header ink-reveal">
      <span class="section-label">W R I T E</span>
      <h2 class="section-title">留下您的心願</h2>
      <div class="section-title-ornament"><span class="dot"></span></div>
    </div>

    <div class="pw-form-wrapper ink-reveal">
      <div class="pw-form" id="prayerForm">
        <!-- Nickname -->
        <div class="pw-field">
          <label class="pw-label" for="nickInput">暱稱</label>
          <input type="text" class="pw-input" id="nickInput"
                 placeholder="虔誠信眾（可自填暱稱，最多10字）" maxlength="10">
        </div>

        <!-- Wish Content -->
        <div class="pw-field">
          <label class="pw-label" for="wishInput">心願內容</label>
          <div class="pw-textarea-wrap">
            <textarea class="pw-textarea" id="wishInput"
                      placeholder="願以此言，祈求神明庇佑……" maxlength="150"></textarea>
            <span class="pw-char-count"><span id="wishCharCount">0</span> / 150</span>
          </div>
        </div>

        <!-- Visibility Option -->
        <div class="pw-field">
          <label class="pw-label">公開選項</label>
          <div class="pw-radio-cards">
            <label class="pw-radio-card">
              <input type="radio" name="visibility" value="public" checked>
              <span class="pw-radio-card-inner">
                <span class="pw-radio-icon">🌏</span>
                <span class="pw-radio-name">公開顯示</span>
                <span class="pw-radio-desc">所有訪客可見</span>
              </span>
            </label>
            <label class="pw-radio-card">
              <input type="radio" name="visibility" value="private">
              <span class="pw-radio-card-inner">
                <span class="pw-radio-icon">🔒</span>
                <span class="pw-radio-name">僅廟方可見</span>
                <span class="pw-radio-desc">只有廟方後台可看到</span>
              </span>
            </label>
          </div>
        </div>

        <!-- Error Message -->
        <p class="pw-error" id="formError" hidden></p>

        <!-- Submit -->
        <button class="btn-seal pw-submit-btn" id="submitBtn">🙏 稟告神明</button>

        <!-- Success Toast -->
        <p class="pw-success" id="formSuccess" hidden></p>
      </div>
    </div>
  </div>
</section>

<!-- ========== Wall Section ========== -->
<section class="pw-wall" id="wall-section">
  <div class="container">
    <div class="section-header ink-reveal">
      <span class="section-label">P R A Y E R &ensp; W A L L</span>
      <h2 class="section-title">眾人心願</h2>
      <div class="section-title-ornament"><span class="dot"></span></div>
    </div>

    <!-- Filter Bar -->
    <div class="pw-filters ink-reveal" id="filterBar" role="group" aria-label="依擲筊結果篩選心願">
      <button class="btn-seal btn-seal--compact filter-btn active" data-filter="全部" aria-pressed="true">全部</button>
      <button class="btn-seal btn-seal--compact filter-btn" data-filter="聖筊" aria-pressed="false">聖筊</button>
      <button class="btn-seal btn-seal--compact filter-btn" data-filter="笑筊" aria-pressed="false">笑筊</button>
      <button class="btn-seal btn-seal--compact filter-btn" data-filter="陰筊" aria-pressed="false">陰筊</button>
      <button class="btn-seal btn-seal--compact filter-btn" data-filter="純祈願" aria-pressed="false">純祈願</button>
    </div>

    <!-- Cards Container -->
    <div class="pw-cards" id="cardsContainer" aria-live="polite"></div>

    <!-- 分頁：心願一多時不一次全部載入 -->
    <div class="pw-more" id="moreWrap" hidden>
      <button class="btn-seal" id="moreBtn">載入更多心願</button>
    </div>
  </div>
</section>

<!-- ========== Footer（由 js/layout.js 注入）========== -->
<div id="site-footer"></div>

<script src="js/layout.js" defer></script>
<script src="js/temple-common.js" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/supabase-api.js" defer></script>
<script src="js/prayer-wall.js" defer></script>
</body>
</html>
