<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E8A040" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E1A2E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#1E1A2E"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#A07D2E" stroke-width="1" opacity="0.3"/>
  <rect x="25" y="25" width="550" height="350" fill="none" stroke="#A07D2E" stroke-width="0.5" opacity="0.15"/>
